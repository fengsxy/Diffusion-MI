[tool.poetry]
name = "diffusion-mi"
version = "0.1.0"
description = "Diffusion Mutual Information (DMI) estimators and benchmarks"
authors = [
    "fengsxy <longxuan.yu@email.ucr.edu>",
    "kxh001 <xianghao.kong@email.ucr.edu>",
    "Tong <amazingjtt@gmail.com>",
    "Xing Shi <xshi068@ucr.edu>"
]
readme = "README.MD"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "dmi", from = "src"}, {include = "estimators", from = "src"}]
include = [{path = "docs/assets/diffusion-mi-logo.png", format = "sdist"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
pytorch-lightning = "*"
lightning = "*"
torch = "*"
torchvision = {version = "*", optional = true}
numpy = "*"
scipy = "*"
matplotlib = "*"
tqdm = "*"
scikit-learn = "*"
huggingface-hub = {version = "*", optional = true}

[tool.poetry.extras]
images = ["torchvision", "huggingface-hub"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7"
build = ">=1"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["benchmark: stochastic accuracy experiments (run separately from regression tests)"]

[tool.poetry.urls]
Homepage = "https://github.com/fengsxy/Diffusion-MI"
Repository = "https://github.com/fengsxy/Diffusion-MI"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
